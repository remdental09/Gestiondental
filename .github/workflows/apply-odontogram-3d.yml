name: Apply reviewed odontogram 3D changes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify source changes
        shell: bash
        env:
          EDITS_B64: ''
        run: |
          python3 -c "$(printf '%s' '' | base64 -d)"
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/odontogram.tsx components/tooth-3d-modal.tsx components/tooth-3d-stage.tsx docs/PROJECT_STATE.md
          git rm .github/workflows/apply-odontogram-3d.yml
          git commit -m 'Completa vista 3D del odontograma'
          git push origin HEAD:main
