name: Publicar Worker de Gestión Dental

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Comprobar acceso de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.WRANGLER_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'No hay un token Cloudflare accesible en los secretos de esta acción.' >&2
            exit 1
          fi
      - name: Comprobar transcripción de audio
        run: |
          node --experimental-strip-types --test tests/audio-transcription.test.mjs
          pnpm exec tsc --noEmit --strict --skipLibCheck --allowImportingTsExtensions --module esnext --moduleResolution bundler --target es2022 --lib es2023,dom lib/dictation/audio-transcription.ts lib/dictation/openai-transcription.ts
      - name: Compilar Worker con los bindings D1/R2 existentes
        run: CLOUDFLARE_DEPLOY=1 pnpm build
      - name: Desplegar Worker compilado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.WRANGLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          pnpm exec wrangler deploy --config dist/server/wrangler.json
